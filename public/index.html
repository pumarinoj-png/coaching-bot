<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach IA - Libera Tu Tiempo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* PANTALLA DE PALANCAS */
        .screen {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* GRUPOS DE PALANCAS */
        .grupo-palancas {
            margin-bottom: 25px;
        }

        .grupo-titulo {
            font-weight: 700;
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .palancas-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .palanca-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .palanca-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .palanca-btn strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .palanca-btn small {
            font-size: 12px;
            opacity: 0.7;
        }

        /* PANTALLA DE CHAT */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.assistant .message-content {
            background: white;
            border-left: 3px solid #667eea;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 15px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ENTRADA */
        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 15px;
            display: flex;
            gap: 10px;
            background: white;
        }

        .input-area input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .input-area button:hover {
            background: #764ba2;
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-btn {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            color: #333;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        /* RESUMEN FINAL */
        .summary-screen {
            padding: 20px;
            text-align: center;
        }

        .summary-screen h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .summary-screen p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }

        .summary-screen button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .summary-screen button:hover {
            background: #764ba2;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Coach IA</h1>
            <p>Libera tiempo para lo importante</p>
        </div>

        <!-- PANTALLA 1: SELECCIONAR PALANCA -->
        <div class="screen active" id="screen-palancas">
            <h2 style="margin-bottom: 20px; color: #333;">¿Qué deseas evaluar para liberar más tiempo?</h2>
            <div class="palancas-grid" id="palancas-grid"></div>
        </div>

        <!-- PANTALLA 2: CHAT -->
        <div class="screen" id="screen-chat">
            <button class="back-btn" onclick="volverAlInicio()">← Volver</button>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="input-area">
                <input 
                    type="text" 
                    id="input-texto" 
                    placeholder="Escribe tu respuesta..."
                    onkeypress="if(event.key==='Enter') enviarMensaje()"
                >
                <button onclick="enviarMensaje()" id="btn-enviar">Enviar</button>
            </div>
        </div>

        <!-- PANTALLA 3: RESUMEN -->
        <div class="screen" id="screen-summary">
            <div class="summary-screen">
                <h2>✓ Coaching Completado</h2>
                <p id="summary-text"></p>
                <button onclick="volverAlInicio()">Hacer otro coaching</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // SECCIÓN DE PROMPTS - FÁCIL DE EDITAR
        // ============================================================
        // Edita estos prompts para cambiar cómo el coach se comporta
        // Cada prompt es la instrucción base para el coach
        
        const PROMPTS_COACH = {
            delegar: `Eres un coach ejecutivo especializado en liderazgo. El participante ha elegido "Delegar".

Tu objetivo: Encontrar algo que el líder hace y podría estar en manos de otra persona, transfiriendo responsabilidad real.

INSTRUCCIONES:
- Una pregunta a la vez, adapta según sus respuestas
- Indaga qué hace el líder que otro podría asumir
- Distingue: ¿falta capacidad o falta confianza?
- Tono: ejecutivo, directo, SIN terapéutico
- Cuando cierre, termina con: "COMPROMISO: [qué delegará a quién, cuándo]"`,

            autonomia: `Eres un coach ejecutivo. El participante ha elegido "Dar Autonomía".

Tu objetivo: Detectar dónde existe dependencia innecesaria del líder en decisiones.

INSTRUCCIONES:
- Una pregunta a la vez
- Identifica qué decisiones llegan innecesariamente
- Ayuda a transferir autoridad de decisión
- Tono: ejecutivo, directo
- Cuando cierre, termina con: "COMPROMISO: [qué decisión transferirá, cuándo]"`,

            sobrecarga: `Eres un coach ejecutivo. El participante ha elegido "Evitar Sobreintervención".

Tu objetivo: Identificar cuándo el líder interviene después de delegar, reduciendo autonomía.

INSTRUCCIONES:
- Una pregunta a la vez
- Busca la brecha entre delegar e intervenir constantemente
- Desafía el perfeccionismo que lleva a controlar
- Tono: ejecutivo, desafiante pero sin juzgar
- Cuando cierre, termina con: "COMPROMISO: [en qué NO intervendrá, cuándo]"`,

            priorizar: `Eres un coach ejecutivo. El participante ha elegido "Priorizar".

Tu objetivo: Distinguir entre urgente, importante y lo que requiere su intervención como líder.

INSTRUCCIONES:
- Una pregunta a la vez
- Indaga en su agenda real
- Identifica qué importante está siendo desplazado por lo urgente
- Tono: ejecutivo, sin sermones
- Cuando cierre, termina con: "COMPROMISO: [qué eliminará/delegará, cuándo]"`,

            eliminar: `Eres un coach ejecutivo. El participante ha elegido "Eliminar".

Tu objetivo: Ayudarlo a cuestionar si una actividad realmente debe hacerse.

INSTRUCCIONES:
- Una pregunta a la vez
- Indaga en su realidad, no expliques conceptos
- Cuando proponga algo genérico, presiona: "¿Qué significa concretamente?"
- Tono: directo, orientado a la acción
- Cuando cierre, termina con: "COMPROMISO: [qué eliminará, cuándo probará]"`,

            sistematizar: `Eres un coach ejecutivo. El participante ha elegido "Sistematizar".

Tu objetivo: Transformar soluciones repetitivas en procesos o estándares.

INSTRUCCIONES:
- Una pregunta a la vez
- Identifica problemas recurrentes
- Ayuda a crear un estándar o protocolo
- Tono: práctico, orientado a resultados
- Cuando cierre, termina con: "COMPROMISO: [qué estándar/protocolo creará, cuándo]"`,

            criterios: `Eres un coach ejecutivo. El participante ha elegido "Aclarar Criterios y Roles".

Tu objetivo: Hacer explícitos los criterios con los que el líder decide, para que el equipo pueda resolverlas sin consultarle.

INSTRUCCIONES:
- Una pregunta a la vez
- Identifica qué decisiones se repiten
- Saca a la luz el criterio tácito que usa
- Tono: directo, enfocado en lo observable
- Cuando cierre, termina con: "COMPROMISO: [qué criterio explicará, a quién, cuándo]"`,

            desarrollo: `Eres un coach ejecutivo. El participante ha elegido "Desarrollar al Equipo".

Tu objetivo: Identificar problemas que el líder resuelve repetidamente y transformarlos en aprendizaje.

INSTRUCCIONES:
- Una pregunta a la vez
- Busca patrones: ¿qué problema resuelve repetidamente?
- Identifica qué podría aprender la persona
- Tono: ejecutivo, no te quedes en empatía
- Cuando cierre, termina con: "COMPROMISO: [qué conversación tendrá, con quién, cuándo]"`,

            seguimiento: `Eres un coach ejecutivo. El participante ha elegido "Crear Mecanismos de Seguimiento".

Tu objetivo: Diseñar mecanismos que hagan visible el avance sin que el líder persiga información.

INSTRUCCIONES:
- Una pregunta a la vez
- Identifica qué cosas persigue constantemente
- Ayuda a diseñar un mecanismo de visibilidad
- Tono: ejecutivo, práctico
- Cuando cierre, termina con: "COMPROMISO: [qué mecanismo implementará, cuándo]"`,

            test: `Eres un coach ejecutivo. El participante NO sabe cuál palanca elegir.

Tu objetivo: Hacer UN cuestionario breve (máximo 2-3 preguntas) para que identifique por dónde partir.

INSTRUCCIONES:
- Haz UNA pregunta a la vez
- Escucha bien y sugiere una palanca específica basada en su respuesta
- Cuando sugieras una palanca, termina con: "RECOMENDACIÓN: Te sugiero empezar con [PALANCA] porque..."
- Luego el sistema automáticamente iniciará esa palanca`
        };

        // ============================================================
        // DATOS DE PALANCAS AGRUPADAS
        // ============================================================
        // No necesitas editar esto, solo agrégalo en la UI
        
        const GRUPOS_PALANCAS = {
            soltar: {
                titulo: "SOLTAR - Reduce lo que solo tú haces",
                palancas: [
                    {
                        id: "delegar",
                        nombre: "Delegar",
                        descripcion: "Transfiere responsabilidad real al equipo",
                        icon: "🤝"
                    },
                    {
                        id: "autonomia",
                        nombre: "Dar Autonomía",
                        descripcion: "Reduce dependencia en decisiones",
                        icon: "🦸"
                    },
                    {
                        id: "sobrecarga",
                        nombre: "Evitar Sobreintervención",
                        descripcion: "Deja que otros hagan a su manera",
                        icon: "⏸️"
                    }
                ]
            },
            enfocar: {
                titulo: "ENFOCAR - Dedícate a lo que importa",
                palancas: [
                    {
                        id: "priorizar",
                        nombre: "Priorizar",
                        descripcion: "Distingue urgente de importante",
                        icon: "⚡"
                    },
                    {
                        id: "eliminar",
                        nombre: "Eliminar",
                        descripcion: "Cuestiona actividades que no aportan",
                        icon: "🗑️"
                    },
                    {
                        id: "sistematizar",
                        nombre: "Sistematizar",
                        descripcion: "Convierte lo repetitivo en procesos",
                        icon: "⚙️"
                    }
                ]
            },
            habilitar: {
                titulo: "HABILITAR - Multiplica capacidad del equipo",
                palancas: [
                    {
                        id: "criterios",
                        nombre: "Aclarar Criterios y Roles",
                        descripcion: "Haz explícito cómo decides",
                        icon: "🎯"
                    },
                    {
                        id: "desarrollo",
                        nombre: "Desarrollar al Equipo",
                        descripcion: "Convierte problemas en aprendizaje",
                        icon: "📈"
                    },
                    {
                        id: "seguimiento",
                        nombre: "Mecanismos de Seguimiento",
                        descripcion: "Visualiza sin perseguir información",
                        icon: "📊"
                    }
                ]
            }
        };

        // ESTADO GLOBAL
        let estadoActual = {
            palancaSeleccionada: null,
            mensajes: [],
            conteoMensajes: 0
        };

        // INICIALIZAR
        document.addEventListener('DOMContentLoaded', () => {
            mostrarPalancas();
        });

        // MOSTRAR PALANCAS CON GRUPOS
        function mostrarPalancas() {
            const screenPalancas = document.getElementById('screen-palancas');
            
            // Limpiar y recrear título
            screenPalancas.innerHTML = '<h2 style="margin-bottom: 20px; color: #333;">¿Qué deseas evaluar para liberar más tiempo?</h2>';
            
            // Mostrar cada grupo
            Object.entries(GRUPOS_PALANCAS).forEach(([groupKey, grupo]) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'grupo-palancas';
                
                const titulo = document.createElement('div');
                titulo.className = 'grupo-titulo';
                titulo.textContent = grupo.titulo;
                groupDiv.appendChild(titulo);
                
                const grid = document.createElement('div');
                grid.className = 'palancas-grid';
                
                grupo.palancas.forEach(palanca => {
                    const btn = document.createElement('button');
                    btn.className = 'palanca-btn';
                    btn.innerHTML = `
                        <strong>${palanca.icon} ${palanca.nombre}</strong>
                        <small>${palanca.descripcion}</small>
                    `;
                    btn.onclick = () => seleccionarPalanca(palanca.id);
                    grid.appendChild(btn);
                });
                
                groupDiv.appendChild(grid);
                screenPalancas.appendChild(groupDiv);
            });
            
            // Agregar opción "No sé cuál elegir"
            const groupDiv = document.createElement('div');
            groupDiv.className = 'grupo-palancas';
            
            const titulo = document.createElement('div');
            titulo.className = 'grupo-titulo';
            titulo.textContent = '¿INDECISO?';
            groupDiv.appendChild(titulo);
            
            const grid = document.createElement('div');
            grid.className = 'palancas-grid';
            
            const btn = document.createElement('button');
            btn.className = 'palanca-btn';
            btn.style.background = '#fff3cd';
            btn.style.borderColor = '#ffc107';
            btn.innerHTML = `
                <strong>❓ No sé cuál elegir</strong>
                <small>Te ayudaré a encontrar la palanca correcta</small>
            `;
            btn.onclick = () => seleccionarPalanca('test');
            grid.appendChild(btn);
            
            groupDiv.appendChild(grid);
            screenPalancas.appendChild(groupDiv);
        }

        // SELECCIONAR PALANCA
        async function seleccionarPalanca(key) {
            estadoActual.palancaSeleccionada = key;
            estadoActual.mensajes = [];
            estadoActual.conteoMensajes = 0;

            // Cambiar pantalla
            document.getElementById('screen-palancas').classList.remove('active');
            document.getElementById('screen-chat').classList.add('active');

            // Limpiar chat
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';

            // Mostrar indicador de carga mientras el coach prepara su primer mensaje
            const loading = document.createElement('div');
            loading.className = 'message assistant';
            loading.innerHTML = `<div class="loading"><span></span><span></span><span></span></div>`;
            chatBox.appendChild(loading);

            // IMPORTANTE: la API de Claude requiere que la conversación
            // empiece y termine en un mensaje "user". Por eso el primer
            // mensaje que enviamos es un "user" invisible que dispara
            // la primera pregunta real del coach (generada por Claude,
            // no hardcodeada).
            estadoActual.mensajes.push({
                role: 'user',
                content: 'Hola, quiero empezar el coaching.'
            });

            await obtenerRespuestaCoach('');

            loading.remove();
        }

        // ENVIAR MENSAJE
        async function enviarMensaje() {
            const input = document.getElementById('input-texto');
            const texto = input.value.trim();

            if (!texto) return;

            // Mostrar mensaje del usuario
            const chatBox = document.getElementById('chat-messages');
            const msgUsuario = document.createElement('div');
            msgUsuario.className = 'message user';
            msgUsuario.innerHTML = `<div class="message-content">${texto}</div>`;
            chatBox.appendChild(msgUsuario);

            // Agregar al historial
            estadoActual.mensajes.push({
                role: 'user',
                content: texto
            });

            estadoActual.conteoMensajes++;

            // Limpiar input
            input.value = '';
            input.focus();

            // Desplazar al final
            chatBox.scrollTop = chatBox.scrollHeight;

            // Mostrar indicador de carga
            const loading = document.createElement('div');
            loading.className = 'message assistant';
            loading.innerHTML = `<div class="loading"><span></span><span></span><span></span></div>`;
            chatBox.appendChild(loading);

            // Obtener respuesta
            await obtenerRespuestaCoach(texto);

            // Remover loading
            loading.remove();
        }

        // OBTENER RESPUESTA DEL COACH
        async function obtenerRespuestaCoach(mensajeUsuario) {
            try {
                document.getElementById('btn-enviar').disabled = true;
                const chatBox = document.getElementById('chat-messages');

                // Construir payload
                const payload = {
                    palanca: estadoActual.palancaSeleccionada,
                    mensajes: estadoActual.mensajes,
                    conteoMensajes: estadoActual.conteoMensajes
                };

                console.log('Enviando request:', payload);

                // Intentar con rutas alternativas
                let endpoint = '/api/chat';
                let respuesta = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => {
                    console.error('Error en fetch:', err);
                    throw err;
                });

                if (!respuesta.ok) {
                    const errorText = await respuesta.text();
                    console.error(`HTTP ${respuesta.status}:`, errorText);
                    
                    if (respuesta.status === 404) {
                        throw new Error('Endpoint /api/chat no encontrado. Verifica que la Vercel Function esté deployada correctamente.');
                    }
                    throw new Error(`Error HTTP ${respuesta.status}`);
                }

                const datos = await respuesta.json();
                console.log('Respuesta recibida:', datos);

                if (datos.error) {
                    mostrarError(`Error del servidor: ${datos.error}\n${datos.details || ''}`);
                    document.getElementById('btn-enviar').disabled = false;
                    return;
                }

                // Agregar respuesta al historial
                estadoActual.mensajes.push({
                    role: 'assistant',
                    content: datos.respuesta
                });

                // Mostrar respuesta
                const msgCoach = document.createElement('div');
                msgCoach.className = 'message assistant';
                msgCoach.innerHTML = `<div class="message-content">${datos.respuesta}</div>`;
                chatBox.appendChild(msgCoach);

                chatBox.scrollTop = chatBox.scrollHeight;

                // Detectar finalizador en la respuesta
                const esFinalizador = datos.respuesta.includes('COMPROMISO:') || datos.respuesta.includes('RECOMENDACIÓN:');
                
                // Si recomienda una palanca (flujo test), cambiar automáticamente
                if (estadoActual.palancaSeleccionada === 'test' && datos.respuesta.includes('RECOMENDACIÓN:')) {
                    // Esperar y luego mostrar resumen
                    setTimeout(() => {
                        mostrarResumen();
                    }, 2000);
                }
                // Si es compromiso final, mostrar resumen
                else if (esFinalizador && estadoActual.conteoMensajes >= 5) {
                    setTimeout(() => {
                        mostrarResumen();
                    }, 1500);
                }

                document.getElementById('btn-enviar').disabled = false;
                document.getElementById('input-texto').focus();

            } catch (error) {
                console.error('Error completo:', error);
                mostrarError(`⚠️ Error: ${error.message}\n\nVerifica que:\n1. Tu CLAUDE_API_KEY esté en Vercel\n2. La Vercel Function esté deployada\n3. Espera 1-2 min después de agregar variables`);
                document.getElementById('btn-enviar').disabled = false;
            }
        }

        // MOSTRAR ERROR
        function mostrarError(msg) {
            const chatBox = document.getElementById('chat-messages');
            const error = document.createElement('div');
            error.className = 'error-message';
            error.textContent = msg;
            chatBox.appendChild(error);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // MOSTRAR RESUMEN
        function mostrarResumen() {
            document.getElementById('screen-chat').classList.remove('active');
            document.getElementById('screen-summary').classList.add('active');

            let nombrePalanca = estadoActual.palancaSeleccionada;
            
            if (estadoActual.palancaSeleccionada === 'test') {
                document.getElementById('summary-text').innerHTML = `
                    ¡Listo! Ahora que sabes por dónde partir, puedes hacer otro coaching con la palanca indicada.
                    <br><br>
                    Recuerda: el objetivo es implementar las acciones concretas en tu día a día.
                `;
            } else {
                // Encontrar el nombre de la palanca
                for (const grupo of Object.values(GRUPOS_PALANCAS)) {
                    const palanca = grupo.palancas.find(p => p.id === estadoActual.palancaSeleccionada);
                    if (palanca) {
                        nombrePalanca = palanca.nombre;
                        break;
                    }
                }
                
                document.getElementById('summary-text').innerHTML = `
                    Hemos explorado <strong>${nombrePalanca}</strong> contigo y llegamos a acciones concretas.
                    <br><br>
                    Recuerda: el objetivo es implementar lo que decidimos en tu día a día.
                `;
            }
        }

        // VOLVER AL INICIO
        function volverAlInicio() {
            document.getElementById('screen-palancas').classList.add('active');
            document.getElementById('screen-chat').classList.remove('active');
            document.getElementById('screen-summary').classList.remove('active');
            estadoActual = {
                palancaSeleccionada: null,
                mensajes: [],
                conteoMensajes: 0
            };
        }
    </script>
</body>
</html>
